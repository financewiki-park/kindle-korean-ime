name: Build KPM repository

on:
  push:
    branches: [ main ]
    paths:
      - 'package/**'
      - '.github/workflows/build-kpm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .kpkg
        run: |
          mkdir -p packages/korean-ime-probe/artifacts
          tar -C package -czf packages/korean-ime-probe/artifacts/korean-ime-probe_0.1.0_kindlehf-kindlepw2.kpkg .
          tar -tzf packages/korean-ime-probe/artifacts/korean-ime-probe_0.1.0_kindlehf-kindlepw2.kpkg

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: korean-ime-probe-0.1.0
          path: packages/korean-ime-probe/artifacts/korean-ime-probe_0.1.0_kindlehf-kindlepw2.kpkg
          if-no-files-found: error

      - name: Publish stable KPM artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f packages/korean-ime-probe/artifacts/korean-ime-probe_0.1.0_kindlehf-kindlepw2.kpkg
          if git diff --cached --quiet; then
            echo "Artifact already current"
          else
            git commit -m "Publish Korean IME Probe 0.1.0"
            git push
          fi
