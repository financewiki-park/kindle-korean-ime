# Korean IME persistent bridge -- installed only by this KPM package.
description "Korean IME X11 bridge"
start on framework_ready
stop on stopping framework
task
script
    PACKAGE=/mnt/us/kmc/kpm/packages/korean-ime
    STATE=/mnt/us/korean-ime
    [ -x "$PACKAGE/bin/kindlehf/korean-ime-x11" ] || exit 0
    cd "$PACKAGE" || exit 0
    sh ./scriptlets/run-native-bridge.sh >>"$STATE/autostart.log" 2>&1
end script
